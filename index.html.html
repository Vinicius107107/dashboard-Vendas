<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG · Resultado Junho 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fdf4f3;
  --card:#ffffff;
  --card2:#fce8e6;
  --border:#f0d5d2;
  --text:#1a1020;
  --muted:#9e7f7c;
  --green:#15803d;--green-bg:#dcfce7;
  --yellow:#b45309;--yellow-bg:#fef3c7;
  --red:#b91c1c;--red-bg:#fee2e2;
  --blue:#1d4ed8;--blue-bg:#dbeafe;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;min-width:860px;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.h-brand{display:flex;align-items:center;gap:10px;}
.h-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);}
.h-title{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--text);}
.h-title span{color:var(--blue);}
.h-meta{font-size:11px;color:var(--muted);}
.h-pills{display:flex;gap:8px;}
.pill{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:11px;color:var(--muted);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.pill strong{color:var(--text);}

/* TOTAIS */
.totais{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px;}
.tot{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.tot-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7c4a47;margin-bottom:3px;}
.tot-val{font-size:16px;font-weight:800;color:#1a1020;}
.tot-sub{font-size:10px;color:var(--muted);margin-top:1px;}

/* SORT BAR */
.sort-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;}
.sort-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7c4a47;margin-right:4px;white-space:nowrap;}
.sbtn{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:11px;font-family:inherit;color:var(--muted);cursor:pointer;font-weight:600;transition:all .15s;}
.sbtn:hover{border-color:#c0392b;color:#c0392b;}
.sbtn.active{background:#c0392b;border-color:#c0392b;color:#fff;}
.sort-pos{margin-left:auto;font-size:10px;color:var(--muted);font-weight:600;font-style:italic;}

/* TABELA */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--card2);border-bottom:1px solid var(--border);}
th{padding:8px 10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#7c4a47;text-align:right;white-space:nowrap;}
th:first-child{text-align:left;padding-left:16px;}
th.center{text-align:center;}
tbody tr{border-top:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:#fce8e6;}
td{padding:7px 10px;font-size:12px;text-align:right;vertical-align:middle;color:var(--text);}
td:first-child{text-align:left;padding-left:16px;}
.loja-name{font-size:13px;font-weight:700;color:#1a1020;white-space:nowrap;}
.val-real{font-weight:700;font-size:13px;color:#1a1020;}
.val-proj{font-weight:700;font-size:13px;}
.pct{display:inline-flex;align-items:center;justify-content:center;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:800;white-space:nowrap;}
.pct-g{background:var(--green-bg);color:var(--green);}
.pct-y{background:var(--yellow-bg);color:var(--yellow);}
.pct-r{background:var(--red-bg);color:var(--red);}
.pct-b{background:var(--blue-bg);color:var(--blue);}
.bar-wrap{display:flex;align-items:center;gap:6px;}
.bar-track{flex:1;background:rgba(0,0,0,.08);border-radius:20px;height:6px;overflow:hidden;min-width:60px;}
.bar-fill{height:100%;border-radius:20px;}

/* RODAPÉ */
.footer{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#9e7f7c;}
.legend{display:flex;gap:14px;}
.leg{display:flex;align-items:center;gap:5px;}
.leg-dot{width:7px;height:7px;border-radius:50%;}

/* BOTÃO PRINT */
.btn-print{position:fixed;bottom:24px;right:24px;background:#c0392b;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(192,57,43,.3);display:flex;align-items:center;gap:8px;z-index:999;}
.btn-print:hover{background:#a93226;}
@media print{
  .btn-print{display:none!important;}
  .sort-bar{display:none!important;}
  .header{position:static!important;}
  body{padding:6px;min-width:unset!important;background:#fff!important;}
  .totais{gap:4px;margin-bottom:8px;}
  .tot{padding:6px 10px;}
  .tot-val{font-size:13px!important;}
  .tot-lbl{font-size:8px!important;}
  .table-wrap{box-shadow:none;border:1px solid #ddd;}
  th{padding:5px 7px!important;font-size:8px!important;}
  td{padding:4px 7px!important;font-size:10px!important;}
  .loja-name{font-size:11px!important;}
  .val-real,.val-proj{font-size:10px!important;}
  .pct{padding:2px 5px!important;font-size:9px!important;}
  .bar-track{min-width:40px!important;}
  .footer{margin-top:6px;}
  @page{size:A4 landscape;margin:8mm;}
}
</style>
</head>
<body>

<div class="header">
  <div class="h-brand">
    <div class="h-dot"></div>
    <div>
      <div class="h-title"><span>BG</span> · Resultado do Mês</div>
      <div class="h-meta">Junho 2026 · Gerado em <span id="dataGer"></span></div>
    </div>
  </div>
  <div class="h-pills">
    <div class="pill">D<strong id="diaUtil">7</strong> de trabalho</div>
    <div class="pill">Rede: <strong id="totalLojas">?</strong> lojas</div>
    <div class="pill">Projeção rede: <strong id="projRede">?</strong></div>
  </div>
</div>

<div class="totais" id="totais"></div>

<div class="sort-bar">
  <span class="sort-label">Ordenar por</span>
  <button class="sbtn active" onclick="setSort('pct_proj',this)">% Projeção</button>
  <button class="sbtn" onclick="setSort('pct_real',this)">% Realizado</button>
  <button class="sbtn" onclick="setSort('realizado',this)">Faturado R$</button>
  <button class="sbtn" onclick="setSort('projecao',this)">Projetado R$</button>
  <button class="sbtn" onclick="setSort('meta',this)">Meta R$</button>
  <button class="sbtn" onclick="setSort('nome',this)">Nome A–Z</button>
  <span class="sort-pos" id="sortPos">Ranking por: % Projeção</span>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:175px">Loja</th>
        <th>Realizado</th>
        <th class="center">% Real</th>
        <th style="width:160px" class="center">Progresso Real</th>
        <th>Projetado</th>
        <th class="center">% Proj</th>
        <th style="width:160px" class="center">Progresso Proj</th>
        <th>Meta</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer">
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:var(--green)"></div> Projeção ≥ 90%</div>
    <div class="leg"><div class="leg-dot" style="background:var(--yellow)"></div> 60–89%</div>
    <div class="leg"><div class="leg-dot" style="background:var(--red)"></div> &lt; 60%</div>
  </div>
  <div>Fonte: OPDV · BG Resultados</div>
</div>

<button class="btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>

<script>
const DATA = [{"loja": "BG - Pelotas", "meta": 142019.07, "realizado": 38686.7, "projecao": 165800.14, "dias": 30, "pct_real": 27.2, "pct_proj": 116.7, "vendas": 681, "ticket": 56.81}, {"loja": "BG - Santa Maria", "meta": 103322.4, "realizado": 25843.23, "projecao": 110756.7, "dias": 30, "pct_real": 25.0, "pct_proj": 107.2, "vendas": 476, "ticket": 54.29}, {"loja": "BG - Iguatemi POA", "meta": 384119.02, "realizado": 91675.38, "projecao": 392894.49, "dias": 30, "pct_real": 23.9, "pct_proj": 102.3, "vendas": 1489, "ticket": 61.57}, {"loja": "BG - Barra", "meta": 295420.91, "realizado": 70473.32, "projecao": 302028.51, "dias": 30, "pct_real": 23.9, "pct_proj": 102.2, "vendas": 1340, "ticket": 52.59}, {"loja": "BG - Country Nova", "meta": 120472.59, "realizado": 26468.54, "projecao": 113436.6, "dias": 30, "pct_real": 22.0, "pct_proj": 94.2, "vendas": 524, "ticket": 50.51}, {"loja": "BG - Total", "meta": 275228.99, "realizado": 57178.31, "projecao": 245049.9, "dias": 30, "pct_real": 20.8, "pct_proj": 89.0, "vendas": 934, "ticket": 61.22}, {"loja": "BG - Aero Tortaria", "meta": 207915.14, "realizado": 39275.72, "projecao": 168324.51, "dias": 30, "pct_real": 18.9, "pct_proj": 81.0, "vendas": 1021, "ticket": 38.47}, {"loja": "BG - Ipiranga", "meta": 586276.89, "realizado": 135632.44, "projecao": 581281.89, "dias": 30, "pct_real": 23.1, "pct_proj": 99.1, "vendas": 2835, "ticket": 47.84}, {"loja": "BG - Patio 24", "meta": 103192.33, "realizado": 24948.7, "projecao": 89102.5, "dias": 25, "pct_real": 24.2, "pct_proj": 86.3, "vendas": 531, "ticket": 46.98}, {"loja": "BG - Medplex", "meta": 195511.11, "realizado": 34598.17, "projecao": 123564.89, "dias": 25, "pct_real": 17.7, "pct_proj": 63.2, "vendas": 812, "ticket": 42.61}, {"loja": "BG - Praia de Belas", "meta": 228884.01, "realizado": 57724.76, "projecao": 247391.83, "dias": 30, "pct_real": 25.2, "pct_proj": 108.1, "vendas": 1437, "ticket": 40.17}, {"loja": "BG - Canoas", "meta": 203513.54, "realizado": 45510.48, "projecao": 195044.91, "dias": 30, "pct_real": 22.4, "pct_proj": 95.8, "vendas": 1164, "ticket": 39.1}, {"loja": "BG - Novo Hamburgo", "meta": 220611.01, "realizado": 54676.38, "projecao": 234327.34, "dias": 30, "pct_real": 24.8, "pct_proj": 106.2, "vendas": 899, "ticket": 60.82}, {"loja": "BG - Higienópolis", "meta": 196626.25, "realizado": 40263.25, "projecao": 172556.79, "dias": 30, "pct_real": 20.5, "pct_proj": 87.8, "vendas": 625, "ticket": 64.42}, {"loja": "BG - Iguatemi Caxias", "meta": 152153.55, "realizado": 34617.4, "projecao": 148360.29, "dias": 30, "pct_real": 22.8, "pct_proj": 97.5, "vendas": 770, "ticket": 44.96}, {"loja": "BG - Bourbon Wallig", "meta": 149663.04, "realizado": 28897.78, "projecao": 123847.63, "dias": 30, "pct_real": 19.3, "pct_proj": 82.8, "vendas": 562, "ticket": 51.42}, {"loja": "BG - Passo Fundo Shopping", "meta": 157863.13, "realizado": 33121.87, "projecao": 141950.87, "dias": 30, "pct_real": 21.0, "pct_proj": 89.9, "vendas": 609, "ticket": 54.39}, {"loja": "BG - João Pessoa", "meta": 63555.53, "realizado": 10483.15, "projecao": 37439.82, "dias": 25, "pct_real": 16.5, "pct_proj": 58.9, "vendas": 299, "ticket": 35.06}, {"loja": "BG - Aero Restaurante", "meta": 561005.12, "realizado": 108104.0, "projecao": 463302.86, "dias": 30, "pct_real": 19.3, "pct_proj": 82.6, "vendas": 2254, "ticket": 47.96}, {"loja": "BG - Zaffari Cabral", "meta": 89920.97, "realizado": 16655.62, "projecao": 71381.23, "dias": 30, "pct_real": 18.5, "pct_proj": 79.4, "vendas": 266, "ticket": 62.62}, {"loja": "BG - Itapema", "meta": 65004.8, "realizado": 25659.53, "projecao": 109969.41, "dias": 30, "pct_real": 39.5, "pct_proj": 169.2, "vendas": 416, "ticket": 61.68}, {"loja": "BG - Ramiro Nova", "meta": 116118.44, "realizado": 17997.14, "projecao": 77130.6, "dias": 30, "pct_real": 15.5, "pct_proj": 66.4, "vendas": 367, "ticket": 49.04}, {"loja": "BG - Medcenter", "meta": 161882.84, "realizado": 28497.39, "projecao": 101776.39, "dias": 25, "pct_real": 17.6, "pct_proj": 62.9, "vendas": 585, "ticket": 48.71}, {"loja": "BG - Bourbon Passo Fundo", "meta": 65004.8, "realizado": 14721.28, "projecao": 63091.2, "dias": 30, "pct_real": 22.6, "pct_proj": 97.1, "vendas": 291, "ticket": 50.59}, {"loja": "BG - Paseo", "meta": 113010.72, "realizado": 19795.16, "projecao": 84836.4, "dias": 30, "pct_real": 17.5, "pct_proj": 75.1, "vendas": 468, "ticket": 42.3}, {"loja": "BG - Saba Atlantida", "meta": 0.0, "realizado": 0, "projecao": 0, "dias": 0, "pct_real": 0, "pct_proj": 0, "vendas": 0, "ticket": 0}];

let sortKey = 'pct_proj';

const fmtK   = v => { if(!v) return '—'; if(v>=1000000) return 'R$ '+(v/1e6).toFixed(2).replace('.',',')+'M'; if(v>=1000) return 'R$ '+(v/1000).toFixed(1).replace('.',',')+'k'; return 'R$ '+v.toLocaleString('pt-BR',{maximumFractionDigits:0}); };
const fmtF   = v => 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctCls = p => p>=90?'pct-g':p>=60?'pct-y':'pct-r';
const barCol = p => p>=90?'var(--green)':p>=60?'var(--yellow)':'var(--red)';
const bar    = (p,c) => `<div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${Math.min(p,100).toFixed(1)}%;background:${c}"></div></div></div>`;

// Totais
const tM=DATA.reduce((s,d)=>s+d.meta,0), tR=DATA.reduce((s,d)=>s+d.realizado,0), tP=DATA.reduce((s,d)=>s+d.projecao,0);
const pR=tM>0?tR/tM*100:0, pP=tM>0?tP/tM*100:0;
const tV=DATA.reduce((s,d)=>s+d.vendas,0);
const nOk=DATA.filter(d=>d.pct_proj>=90).length, nAt=DATA.filter(d=>d.pct_proj>=60&&d.pct_proj<90).length, nCr=DATA.filter(d=>d.pct_proj<60).length;

document.getElementById('totalLojas').textContent = DATA.length;
document.getElementById('projRede').textContent   = pP.toFixed(1)+'%';
document.getElementById('dataGer').textContent    = new Date().toLocaleDateString('pt-BR');

document.getElementById('totais').innerHTML = `
  <div class="tot"><div class="tot-lbl">Meta Total Junho</div><div class="tot-val" style="color:var(--blue)">${fmtK(tM)}</div><div class="tot-sub">${DATA.length} lojas ativas</div></div>
  <div class="tot"><div class="tot-lbl">Faturado Acumulado</div><div class="tot-val">${fmtK(tR)}</div><div class="tot-sub">${pR.toFixed(1)}% da meta</div></div>
  <div class="tot"><div class="tot-lbl">Projeção do Mês</div><div class="tot-val" style="color:${barCol(pP)}">${fmtK(tP)}</div><div class="tot-sub">${pP.toFixed(1)}% da meta</div></div>
  <div class="tot"><div class="tot-lbl">Nº de Vendas</div><div class="tot-val">${tV.toLocaleString('pt-BR')}</div><div class="tot-sub">acumulado no período</div></div>
  <div class="tot"><div class="tot-lbl">Status Lojas</div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <span style="font-size:12px;font-weight:700;color:var(--green)">● ${nOk} OK</span>
      <span style="font-size:12px;font-weight:700;color:var(--yellow)">● ${nAt} Aten.</span>
      <span style="font-size:12px;font-weight:700;color:var(--red)">● ${nCr} Crit.</span>
    </div>
  </div>`;

const LABELS = {pct_proj:'% Projeção', pct_real:'% Realizado', realizado:'Faturado R$', projecao:'Projetado R$', meta:'Meta R$', nome:'Nome A–Z'};

function setSort(key, el) {
  sortKey = key;
  document.querySelectorAll('.sbtn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sortPos').textContent = 'Ranking por: ' + LABELS[key];
  renderTable();
}

function renderTable() {
  const sorted = sortKey === 'nome'
    ? [...DATA].sort((a,b) => a.loja.localeCompare(b.loja,'pt-BR'))
    : [...DATA].sort((a,b) => b[sortKey] - a[sortKey]);

  document.getElementById('tbody').innerHTML = sorted.map(d => {
    const col = barCol(d.pct_proj);
    return `<tr>
      <td class="loja-name">${d.loja.replace('BG - ','')}</td>
      <td class="val-real">${fmtF(d.realizado)}</td>
      <td><span class="pct pct-b">${d.pct_real}%</span></td>
      <td>${bar(d.pct_real,'var(--blue)')}</td>
      <td class="val-proj" style="color:${col}">${fmtF(d.projecao)}</td>
      <td><span class="pct ${pctCls(d.pct_proj)}">${d.pct_proj}%</span></td>
      <td>${bar(d.pct_proj,col)}</td>
      <td style="color:var(--muted);font-size:11px">${fmtF(d.meta)}</td>
    </tr>`;
  }).join('');
}

renderTable();

// Tenta ler o dia útil do dashboard principal (mesmo diretório)
try {
  const req = new XMLHttpRequest();
  req.open('GET', 'dashboard_bg_junho2026.html', false);
  req.send();
  const match = req.responseText.match(/D<strong>(\d+)<\/strong> de trabalho/);
  if (match) document.getElementById('diaUtil').textContent = match[1];
} catch(e) {}
</script>
</body>
</html>
